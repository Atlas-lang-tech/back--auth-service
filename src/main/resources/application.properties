# ===========================
# APPLICATION
# ===========================
quarkus.application.name=auth-service
quarkus.http.port=8080

# ===========================
# DATABASE (PostgreSQL)
# ===========================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=auth_user
quarkus.datasource.password=auth_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/auth_db

# Connection pool
quarkus.datasource.jdbc.min-size=2
quarkus.datasource.jdbc.max-size=10

# ===========================
# HIBERNATE ORM
# ===========================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# ===========================
# FLYWAY (миграции БД)
# ===========================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.baseline-on-migrate=true

# ===========================
# JWT
# ===========================
mp.jwt.verify.issuer=https://atlas.org/auth
mp.jwt.verify.publickey.location=META-INF/resources/publicKey.pem
smallrye.jwt.sign.key.location=META-INF/resources/privateKey.pem

# Access token TTL (15 минут)
atlas.jwt.access-token.expiry=900
# Refresh token TTL (7 дней в секундах)
atlas.jwt.refresh-token.expiry=604800

# ===========================
# REDIS
# ===========================
quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.timeout=10s

# ===========================
# gRPC
# ===========================
quarkus.grpc.server.port=9000
quarkus.grpc.server.enable-reflection-service=true

# ===========================
# RABBITMQ / MESSAGING (SmallRye Reactive Messaging)
# ===========================
# Shared topic-exchange `atlas.events` is the platform event bus.
rabbitmq-host=${RABBITMQ_HOST:localhost}
rabbitmq-port=${RABBITMQ_PORT:5672}
rabbitmq-username=${RABBITMQ_USERNAME:guest}
rabbitmq-password=${RABBITMQ_PASSWORD:guest}

# Outgoing: publish user.registered so billing can provision a default subscription.
mp.messaging.outgoing.user-registered.connector=smallrye-rabbitmq
mp.messaging.outgoing.user-registered.exchange.name=atlas.events
mp.messaging.outgoing.user-registered.exchange.type=topic
mp.messaging.outgoing.user-registered.exchange.durable=true
mp.messaging.outgoing.user-registered.default-routing-key=user.registered

# Outgoing: publish password.reset_requested so mail-service emails the reset link.
mp.messaging.outgoing.password-reset-requested.connector=smallrye-rabbitmq
mp.messaging.outgoing.password-reset-requested.exchange.name=atlas.events
mp.messaging.outgoing.password-reset-requested.exchange.type=topic
mp.messaging.outgoing.password-reset-requested.exchange.durable=true
mp.messaging.outgoing.password-reset-requested.default-routing-key=password.reset_requested

# Incoming: react to subscription.changed (published by billing) to update planCode.
mp.messaging.incoming.subscription-changed.connector=smallrye-rabbitmq
mp.messaging.incoming.subscription-changed.exchange.name=atlas.events
mp.messaging.incoming.subscription-changed.exchange.type=topic
mp.messaging.incoming.subscription-changed.exchange.durable=true
mp.messaging.incoming.subscription-changed.queue.name=auth.subscription-changed
mp.messaging.incoming.subscription-changed.queue.durable=true
mp.messaging.incoming.subscription-changed.routing-keys=subscription.changed
# On failure, reject (nack без requeue) → повідомлення летить у DLX, а не зупиняє канал.
mp.messaging.incoming.subscription-changed.failure-strategy=reject
# Dead-letter failed messages to atlas.events.dlx → auth.subscription-changed.dlq.
mp.messaging.incoming.subscription-changed.auto-bind-dlq=true
mp.messaging.incoming.subscription-changed.dead-letter-exchange=atlas.events.dlx
# Must be `topic` to match how main/billing/vocabulary declare atlas.events.dlx;
# the connector defaults this to `direct`, which would trip PRECONDITION_FAILED.
mp.messaging.incoming.subscription-changed.dead-letter-exchange-type=topic
mp.messaging.incoming.subscription-changed.dead-letter-queue-name=auth.subscription-changed.dlq

# ===========================
# SWAGGER / OPENAPI
# ===========================
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.path=/q/openapi
mp.openapi.extensions.smallrye.info.title=Auth Service API
mp.openapi.extensions.smallrye.info.version=1.0.0

# ===========================
# HEALTH
# ===========================
quarkus.smallrye-health.ui.always-include=true

# ===========================
# LOGGING
# ===========================
quarkus.log.level=INFO
quarkus.log.category."org.atlas".level=DEBUG

# ===========================
# DEV MODE PROFILE
# ===========================
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.category."org.atlas".level=DEBUG

# ===========================
# FORWARD AUTH
# ===========================
atlas.forwardauth.cache-ttl=60

# ===========================
# TEST PROFILE
# ===========================
# Postgres + Redis are provided at runtime by InfraTestResource (Testcontainers);
# datasource URL/credentials and redis.hosts are injected as config overrides.
# Flyway runs the real migrations against the throwaway Postgres container.
%test.quarkus.hibernate-orm.database.generation=none
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.baseline-on-migrate=true

# gRPC client used by AuthGrpcServiceImplTest connects to the in-JVM test server.
# In test mode the legacy separate gRPC server is offset to 9001.
%test.quarkus.grpc.clients.auth.host=localhost
%test.quarkus.grpc.clients.auth.port=9001

# Messaging runs on the in-memory connector under test — no broker needed.
%test.mp.messaging.outgoing.user-registered.connector=smallrye-in-memory
%test.mp.messaging.outgoing.password-reset-requested.connector=smallrye-in-memory
%test.mp.messaging.incoming.subscription-changed.connector=smallrye-in-memory

# JaCoCo: merge @QuarkusTest coverage and the surefire agent into one exec file
# (target/jacoco.exec). The jacoco-maven-plugin then produces the report + gate.
%test.quarkus.jacoco.reuse-data-file=true
%test.quarkus.jacoco.data-file=target/jacoco.exec
%test.quarkus.jacoco.report=false
