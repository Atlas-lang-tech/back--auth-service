# Run plain (non-@QuarkusTest) unit tests before @QuarkusTest classes in the same
# surefire fork. Mixing the two otherwise triggers NoClassDefFoundError in the
# plain tests once a @QuarkusTest has closed its augmented classloader. This
# orderer also groups QuarkusTests by profile to minimise app restarts.
junit.jupiter.testclass.order.default=io.quarkus.test.junit.util.QuarkusTestProfileAwareClassOrderer
